  <path d="M50 46C58.836 46 66 38.836 66 30C66 21.164 58.836 14 50 14C41.164 14 34 21.164 34 30C34 38.836 41.164 46 50 46ZM50 54C34.008 54 18 61.992 18 78V86H82V78C82 61.992 65.992 54 50 54Z" fill="url(#sil)" />
